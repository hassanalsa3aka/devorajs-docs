     Regenerate: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot=assets/og/devorajs-og.png "file://$PWD/scripts/og-card.html" -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0a0a12;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.a{width:520px;height:520px;background:#3b82f6;top:-220px;left:-160px}
.b{width:560px;height:560px;background:#a855f7;bottom:-260px;right:-160px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.wrap{position:relative;height:100%;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700}
.brand img{width:64px;height:64px}
.js{background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;color:transparent}
h1{font-size:76px;line-height:1.05;letter-spacing:-.02em;font-weight:800;max-width:980px}
h1 span{background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;color:transparent}
p{margin-top:22px;font-size:30px;color:#b4b4c6;max-width:960px;line-height:1.35}
.foot{display:flex;gap:14px}
.pill{font-size:22px;font-weight:600;color:#d7d7e3;border:1.5px solid #34344a;background:rgba(19,19,31,.7);border-radius:999px;padding:10px 22px}
</style></head><body>
<div class="blob a"></div><div class="blob b"></div><div class="grid"></div>
<div class="wrap">
  <div class="brand"><img src="../assets/icons/devorajs-logo-withoutbg.png"><span>devora<span class="js">.js</span></span></div>
  <div><h1>Multi-app by default.<br><span>Security-first.</span></h1>
  <p>One project, multiple sites — sharing a core and a backend, each deployed independently.</p></div>
  <div class="foot"><span class="pill">Vite-based</span><span class="pill">React SSR · SSG · Islands</span><span class="pill">npx create-devora</span></div>
</div></body></html>
